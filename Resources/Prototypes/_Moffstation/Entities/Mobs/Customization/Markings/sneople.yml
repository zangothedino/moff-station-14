- type: marking
  id: DroopyStalks
  bodyPart: HeadTop
  groupWhitelist: [ Sneople ]
  coloring:
    layers:
      droopyeyes:
        type: !type:EyeColoring
      droopystalks:
        type: !type:SkinColoring
  sprites:
  - sprite: &headtop_rsi "_Moffstation/Mobs/Customization/Sneople/headtop.rsi"
    state: droopystalks
  - sprite: *headtop_rsi
    state: droopyeyes

- type: marking
  id: LongStalks
  bodyPart: HeadTop
  groupWhitelist: [ Sneople ]
