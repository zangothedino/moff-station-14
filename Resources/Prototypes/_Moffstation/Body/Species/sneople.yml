- type: entity
  parent:
  - AppearanceSneople
  - BaseSpeciesMobOrganic
  id: MobSneople
  name: Snurist McSnail
  components:
  - type: Damageable
    damageModifierSet: Sneople #not sure what this is
  - type: Speech
    speechVerb: Sneople
    speechSounds: UnisexSneople
    allowedEmotes: [ '',] #need to come up with allowed emotes
  - type: TypingIndicator
    proto: sneople
  - type: Vocal
    sounds:
      Male: UnisexSneople
      Female: UnisexSneople
      Unsexed: UnisexSneople
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatChicken #escargo?
      amount: 3
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Caustic
        damage: 400
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: false
        spawn:
          Acidifier:
            min: 1
            max: 1
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:BurnBodyBehavior
        popupMessage: bodyburn-sneople-text-others
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 15
      behaviors:
      - !type:PopupBehavior
        popup: mouth-taste-metal
        popupType: LargeCaution
        targetOnly: true
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 40
      behaviors:
      - !type:VomitBehavior
  - type: DamageVisuals
    thresholds: [ 25, 50, 75, 100 ]
    targetLayers:
    - "enum.HumanoidVisualLayers.Chest"
    - "enum.HumanoidVisualLayers.Head"
    - "enum.HumanoidVisualLayers.LArm"
    - "enum.HumanoidVisualLayers.LLeg"
    - "enum.HumanoidVisualLayers.RArm"
    - "enum.HumanoidVisualLayers.RLeg"
    damageOverlayGroups:
      Brute:
        sprite: _Moffstation/Mobs/Effects/Sneople/brute_damage.rsi
        color: "#C048C2"
      Burn:
        sprite: _Moffstation/Mobs/Effects/Sneople/burn_damage.rsi
  - type: Temperature
    specificHeat: 44
  - type: TemperatureDamage # should change to something else unsure what
    heatDamageThreshold: 325
    coldDamageThreshold: 230
    coldDamage:
      types:
        Cold: 0.1 # Per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 1.5 # Per second, scales with temperature & other constants
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Goo
        Quantity: 300
  - type: TemperatureProtection
    heatingCoefficient: 1.2
    coolingCoefficient: 0.50
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 95 #tiny
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NightVision
  - type: FlashModifier
    modifier: 2
  - type: Reactive
    reactions:
    - reagents: [ Saline, TableSalt, SodiumCarbonate, PestKiller ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        scaling: true
        damage:
          types:
            Caustic: .5
